<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayşe & Tolga - Time in Time</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Orbitron & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <!-- FontAwesome for Butterfly & Heart icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050105;
            color: #ff69b4;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }
        .neon-font {
            font-family: 'Orbitron', sans-serif;
        }
        .neon-glow-pink {
            text-shadow: 0 0 10px #ff1493, 0 0 20px #ff1493, 0 0 30px #ff69b4, 0 0 40px #ff69b4;
        }
        .neon-glow-box {
            box-shadow: 0 0 30px rgba(255, 20, 147, 0.4), inset 0 0 25px rgba(255, 20, 147, 0.2);
            border: 2px solid rgba(255, 105, 180, 0.6);
        }
        /* Matrix Rain Canvas */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        /* Floating hearts and butterflies animation layer */
        #floating-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            overflow: hidden;
        }
        @keyframes floatUp {
            0% {
                transform: translateY(105vh) scale(0.6) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 0.9;
            }
            80% {
                opacity: 0.9;
            }
            100% {
                transform: translateY(-10vh) scale(1.3) rotate(360deg);
                opacity: 0;
            }
        }
        .floating-item {
            position: absolute;
            bottom: -60px;
            animation: floatUp linear infinite;
        }
        /* Main content wrapper above canvas and floating elements */
        .content-layer {
            position: relative;
            z-index: 10;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 md:p-8">

    <!-- Pink Matrix Rain Background -->
    <canvas id="matrix-canvas"></canvas>

    <!-- Floating Butterflies & Hearts Container -->
    <div id="floating-container"></div>

    <header class="w-full text-center mt-6 md:mt-10 content-layer">
        <div class="inline-block px-4 py-1.5 rounded-full bg-pink-950/70 border border-pink-500/40 backdrop-blur-md mb-4 shadow-[0_0_15px_rgba(255,20,147,0.3)]">
            <span class="text-xs md:text-sm tracking-widest text-pink-300 uppercase neon-font">NFC Smart Pendant Experience</span>
        </div>
        <h1 class="text-4xl md:text-7xl font-black tracking-wider neon-font neon-glow-pink text-pink-500 mb-2">
            Genco <span class="text-white text-3xl md:text-6xl">&</span> Tolga
        </h1>
        <p class="text-pink-300/80 text-sm md:text-base tracking-widest uppercase font-semibold">
            Time in Time • Sonsuzluk Döngüsü
        </p>
    </header>

    <main class="w-full max-w-2xl bg-black/70 backdrop-blur-xl rounded-3xl p-6 md:p-10 neon-glow-box content-layer my-8 text-center relative overflow-hidden">
        
        <!-- Decorative corner glows -->
        <div class="absolute -top-12 -left-12 w-32 h-32 bg-pink-600/20 rounded-full blur-2xl pointer-events-none"></div>
        <div class="absolute -bottom-12 -right-12 w-32 h-32 bg-pink-600/20 rounded-full blur-2xl pointer-events-none"></div>

        <div class="mb-6">
            <i class="fa-solid fa-heart-pulse text-4xl text-pink-500 animate-pulse drop-shadow-[0_0_10px_#ff1493]"></i>
            <h2 class="text-xl md:text-2xl font-bold text-pink-200 mt-2 neon-font">Birlikte Geçen Zamanımız</h2>
            <p class="text-xs text-pink-400 mt-1">Başlangıç: 24 Ekim 2010</p>
        </div>

        <!-- Timer Grid -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 my-6">
            <div class="bg-pink-950/40 border border-pink-500/40 rounded-2xl p-4 backdrop-blur-md shadow-inner">
                <span id="days" class="text-3xl md:text-5xl font-black text-white neon-font neon-glow-pink block">00</span>
                <span class="text-xs uppercase tracking-widest text-pink-300 mt-1 block">Gün</span>
            </div>
            <div class="bg-pink-950/40 border border-pink-500/40 rounded-2xl p-4 backdrop-blur-md shadow-inner">
                <span id="hours" class="text-3xl md:text-5xl font-black text-white neon-font neon-glow-pink block">00</span>
                <span class="text-xs uppercase tracking-widest text-pink-300 mt-1 block">Saat</span>
            </div>
            <div class="bg-pink-950/40 border border-pink-500/40 rounded-2xl p-4 backdrop-blur-md shadow-inner">
                <span id="minutes" class="text-3xl md:text-5xl font-black text-white neon-font neon-glow-pink block">00</span>
                <span class="text-xs uppercase tracking-widest text-pink-300 mt-1 block">Dakika</span>
            </div>
            <div class="bg-pink-950/40 border border-pink-500/40 rounded-2xl p-4 backdrop-blur-md shadow-inner">
                <span id="seconds" class="text-3xl md:text-5xl font-black text-white neon-font neon-glow-pink block">00</span>
                <span class="text-xs uppercase tracking-widest text-pink-300 mt-1 block">Saniye</span>
            </div>
        </div>

        <!-- Romantic Quote Section -->
        <div class="mt-8 pt-6 border-t border-pink-500/30">
            <p class="text-pink-100 text-base md:text-lg italic font-light leading-relaxed px-4">
                "Zamanın en güzel akışında, seninle geçen her an bir mucize... İyi ki varsın..."
            </p>
        </div>
    </main>

    <footer class="w-full text-center pb-4 content-layer">
        <p class="text-xs text-pink-400/70 tracking-widest uppercase">
            T & G • NFC Design
        </p>
    </footer>

    <script>
        // --- MATRIX RAIN EFFECT (Pink/Magenta Aesthetic) ---
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const characters = '0123456789GENCETOLGATIMEINHEART<3';
        const fontSize = 16;
        let columns = Math.floor(canvas.width / fontSize);
        let drops = [];

        for (let i = 0; i < columns; i++) {
            drops[i] = Math.floor(Math.random() * -100);
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(5, 1, 5, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ff1493';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = characters.charAt(Math.floor(Math.random() * characters.length));
                
                if (Math.random() > 0.85) {
                    ctx.fillStyle = '#ffffff';
                } else {
                    ctx.fillStyle = '#ff1493';
                }

                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 50);

        // --- FLOATING HEARTS & BUTTERFLIES GENERATOR ---
        const container = document.getElementById('floating-container');
        const icons = [
            'fa-solid fa-heart', 
            'fa-solid fa-butterfly', 
            'fa-solid fa-feather', 
            'fa-solid fa-sparkles',
            'fa-solid fa-ring'
        ];

        function createFloatingElement() {
            const el = document.createElement('div');
            el.className = 'floating-item';
            
            const iconClass = icons[Math.floor(Math.random() * icons.length)];
            const size = Math.floor(Math.random() * 18 + 14);
            el.innerHTML = `<i class="${iconClass}" style="color: #ff69b4; font-size: ${size}px; filter: drop-shadow(0 0 10px #ff1493);"></i>`;
            
            el.style.left = Math.random() * 100 + 'vw';
            const duration = Math.random() * 6 + 7; // 7 to 13 seconds
            el.style.animationDuration = duration + 's';
            
            container.appendChild(el);

            setTimeout(() => {
                el.remove();
            }, duration * 1000);
        }

        // Generate elements continuously
        setInterval(createFloatingElement, 400);

        // --- TIME COUNTER LOGIC (Starting from 24.10.2010) ---
        const startDate = new Date('2026-10-06T00:00:00').getTime();

        function updateTimer() {
            const now = new Date().getTime();
            const difference = now - startDate;

            if (difference > 0) {
                const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((difference % (1000 * 60)) / 1000);

                document.getElementById('days').innerText = String(days).padStart(2, '0');
                document.getElementById('hours').innerText = String(hours).padStart(2, '0');
                document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
                document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
            } else {
                document.getElementById('days').innerText = '00';
                document.getElementById('hours').innerText = '00';
                document.getElementById('minutes').innerText = '00';
                document.getElementById('seconds').innerText = '00';
            }
        }

        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
